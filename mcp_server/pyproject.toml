[project]
name = "bussola-mcp"
version = "0.1.0"
description = "Bússola: servidor MCP de ferramentas financeiras determinísticas"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.24,<2",
    "pydantic>=2.13",
    "google-cloud-bigquery>=3.45",
    "numpy>=2.5",
    "uvicorn>=0.54",
    "google-genai>=2.25.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pyyaml>=6.0.3",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bussola_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "bq: depende de BigQuery real (make test-bq)",
    "gemini: chama a API real de embedding do Gemini (fora do make test)",
]
