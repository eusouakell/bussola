name: static-demo-pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "contracts/fixtures/**"
      - ".github/workflows/static-demo-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build static simulated demo
        env:
          VITE_BUSSOLA_MODO: simulado
          VITE_BUSSOLA_LOGIN: "FALSE"
          VITE_BASE_PATH: /bussola/
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
