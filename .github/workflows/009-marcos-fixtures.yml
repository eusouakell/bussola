name: 009-marcos-fixtures

on:
  push:
    branches:
      - feat/009-marcos-integration-final
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 009-marcos-fixtures
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/009-marcos-integration-final

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Generate milestone goldens from existing fixtures
        working-directory: mcp_server
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          from pathlib import Path

          from bussola_mcp.contratos import ID_ANCORA, TABELAS_FERRAMENTA
          from bussola_mcp.ferramentas.computations import DomainComputations
          from bussola_mcp.ferramentas.fixture_backends import FixtureRepository

          root = Path("..").resolve()
          repo = FixtureRepository(root / "contracts" / "fixtures")
          computations = DomainComputations(repo)
          out = root / "contracts" / "fixtures" / "ferramentas"

          for cut in (202506, 202512):
              result = computations.planejar_marcos(
                  ID_ANCORA,
                  cut,
                  100_000_000.0,
                  24,
                  "alta",
                  True,
              )
              envelope = {
                  "dados": result.dados.model_dump(mode="json"),
                  "fonte": {
                      "ferramenta": "planejar_marcos",
                      "tabelas": list(TABELAS_FERRAMENTA["planejar_marcos"]),
                      "periodo": result.periodo.model_dump(mode="json"),
                  },
                  "avisos": list(result.avisos),
              }
              path = out / f"planejar_marcos__ate_{cut}.json"
              path.write_text(
                  json.dumps(envelope, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              print(path)
          PY

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Regenerate web fixtures and recorded journey
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run fixtures

      - name: Commit generated evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            contracts/fixtures/ferramentas/planejar_marcos__ate_202506.json \
            contracts/fixtures/ferramentas/planejar_marcos__ate_202512.json \
            web/fixtures/goldens.json \
            web/fixtures/roteiro-demo.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test(009): generate milestone fixtures and demo evidence"
          git push origin HEAD:feat/009-marcos-integration-final
