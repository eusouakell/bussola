name: case-v2-visual-qa

on:
  push:
    branches:
      - case/publish-ready-v2
    paths:
      - "web/public/case/**"
      - ".github/workflows/case-v2-visual-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: case-v2-visual-qa
  cancel-in-progress: true

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: case/publish-ready-v2

      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "bin=$chrome" >> "$GITHUB_OUTPUT"

      - name: Start local static server and Chrome
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.bin }}
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory web/public >/tmp/bussola-case-http.log 2>&1 &
          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/case/index.html >/dev/null; then
              break
            fi
            sleep .25
          done

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --hide-scrollbars \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/bussola-case-chrome \
            about:blank >/tmp/bussola-case-chrome.log 2>&1 &

          for _ in {1..40}; do
            if curl --fail --silent http://127.0.0.1:9222/json/list >/dev/null; then
              exit 0
            fi
            sleep .25
          done
          cat /tmp/bussola-case-chrome.log
          exit 1

      - name: Render section QA viewports through Chrome DevTools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/case-v2-qa

          cat >/tmp/render-case-qa.mjs <<'JS'
          import { writeFile } from "node:fs/promises";

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const pages = await fetch("http://127.0.0.1:9222/json/list").then(r => r.json());
          if (!pages.length) throw new Error("No Chrome page target available");

          const ws = new WebSocket(pages[0].webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            ws.addEventListener("open", resolve, { once: true });
            ws.addEventListener("error", reject, { once: true });
          });

          let seq = 0;
          const pending = new Map();
          ws.addEventListener("message", event => {
            const msg = JSON.parse(event.data);
            if (!msg.id || !pending.has(msg.id)) return;
            const { resolve, reject } = pending.get(msg.id);
            pending.delete(msg.id);
            if (msg.error) reject(new Error(JSON.stringify(msg.error)));
            else resolve(msg.result);
          });

          const send = (method, params = {}) => new Promise((resolve, reject) => {
            const id = ++seq;
            pending.set(id, { resolve, reject });
            ws.send(JSON.stringify({ id, method, params }));
          });

          await send("Page.enable");
          await send("Runtime.enable");

          const cases = [
            ["desktop-hero", 1440, 1000, "top"],
            ["desktop-discovery", 1440, 1000, "descoberta"],
            ["desktop-evolution", 1440, 1000, "evolucao"],
            ["desktop-team", 1440, 1000, "pessoas"],
            ["mobile-390-hero", 390, 844, "top"],
            ["mobile-390-discovery", 390, 844, "descoberta"],
            ["mobile-390-evolution", 390, 844, "evolucao"],
            ["mobile-390-team", 390, 844, "pessoas"],
            ["mobile-320-hero", 320, 800, "top"],
            ["mobile-320-discovery", 320, 800, "descoberta"],
            ["mobile-320-evolution", 320, 800, "evolucao"],
            ["mobile-320-team", 320, 800, "pessoas"]
          ];

          for (const [name, width, height, target] of cases) {
            await send("Emulation.setDeviceMetricsOverride", {
              width,
              height,
              deviceScaleFactor: 1,
              mobile: false,
              screenWidth: width,
              screenHeight: height
            });
            await send("Page.navigate", { url: "http://127.0.0.1:4173/case/index.html" });
            await sleep(1200);

            const expression = target === "top"
              ? "window.scrollTo(0,0)"
              : `(() => { const el = document.getElementById(${JSON.stringify(target)}); if (!el) throw new Error("missing target"); const y = el.getBoundingClientRect().top + window.scrollY - 64; window.scrollTo(0, Math.max(0, y)); })()`;

            await send("Runtime.evaluate", { expression, awaitPromise: true, returnByValue: true });
            await sleep(350);

            const shot = await send("Page.captureScreenshot", {
              format: "png",
              fromSurface: true,
              captureBeyondViewport: false
            });
            await writeFile(`outputs/case-v2-qa/${name}.png`, Buffer.from(shot.data, "base64"));
          }

          ws.close();
          JS

          node /tmp/render-case-qa.mjs

      - name: Commit QA evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/case-v2-qa
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test(case): refresh trustworthy visual QA evidence"
          git push origin HEAD:case/publish-ready-v2
