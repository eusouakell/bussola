<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bússola V2 Visual QA Gallery</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#111;color:#eee}
main{max-width:1500px;margin:auto;padding:24px}
h1{font-size:24px}h2{margin-top:48px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;align-items:start}
figure{margin:0;background:#1d1d1d;padding:10px;border:1px solid #333}
img{display:block;width:100%;height:auto;background:white}
figcaption{font:12px ui-monospace,monospace;padding:8px 2px 2px;color:#bbb}
.desktop{grid-column:1/-1}
.desktop img{width:min(100%,1440px);margin:auto}
</style>
</head>
<body><main>
<h1>Bússola V2 · Visual QA evidence</h1>
<h2>Desktop</h2>
<div class="grid">
<figure class="desktop"><img src="./desktop-hero.png" alt="Desktop hero QA render"><figcaption>desktop · hero · 1440×1000</figcaption></figure>
<figure class="desktop"><img src="./desktop-discovery.png" alt="Desktop discovery QA render"><figcaption>desktop · discovery · 1440×1000</figcaption></figure>
<figure class="desktop"><img src="./desktop-evolution.png" alt="Desktop evolution QA render"><figcaption>desktop · evolution · 1440×1000</figcaption></figure>
<figure class="desktop"><img src="./desktop-team.png" alt="Desktop team QA render"><figcaption>desktop · team · 1440×1000</figcaption></figure>
</div>
<h2>390</h2>
<div class="grid">
<figure><img src="./mobile-390-hero.png" alt="390 hero QA render"><figcaption>390 · hero</figcaption></figure>
<figure><img src="./mobile-390-discovery.png" alt="390 discovery QA render"><figcaption>390 · discovery</figcaption></figure>
<figure><img src="./mobile-390-evolution.png" alt="390 evolution QA render"><figcaption>390 · evolution</figcaption></figure>
<figure><img src="./mobile-390-team.png" alt="390 team QA render"><figcaption>390 · team</figcaption></figure>
</div>
<h2>320</h2>
<div class="grid">
<figure><img src="./mobile-320-hero.png" alt="320 hero QA render"><figcaption>320 · hero</figcaption></figure>
<figure><img src="./mobile-320-discovery.png" alt="320 discovery QA render"><figcaption>320 · discovery</figcaption></figure>
<figure><img src="./mobile-320-evolution.png" alt="320 evolution QA render"><figcaption>320 · evolution</figcaption></figure>
<figure><img src="./mobile-320-team.png" alt="320 team QA render"><figcaption>320 · team</figcaption></figure>
</div>
</main></body></html>
