<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>M8 · Acompanhar — desvio e nova rota</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bussola.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="app tokens {{temaCls}}" data-estado="acompanhar" style="width: 390px; height: 844px; font-family: 'Nunito Sans', system-ui, sans-serif; color: var(--ink)">
<div class="ambient" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="layer" style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px 12px 16px; display: flex; flex-direction: column; gap: 12px">
<dc-import name="MTopo" atual="{{atual}}" tema="{{tema}}" hint-size="366px,102px"></dc-import>

<section class="convo" aria-label="Conversa" style="align-items: stretch">
<div style="display: flex; flex-direction: column; gap: 10px; padding-bottom: 2px">
<div class="month-div" role="separator">
<span class="ln"></span>
<span class="month-pill glass-chrome" style="font-size: 13px"><svg class="i i-sm" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Julho de 2025 liberado</span>
<span class="ln"></span>
</div>

<article class="glass-card enter" aria-label="CardPlanejadoRealizado" style="padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div class="row-between">
<span class="tag tag-diag"><svg class="i i-sm" viewBox="0 0 24 24" style="stroke-width: 2.4"><path d="M3 12h4l2-6 4 12 2-6h6"></path></svg>Diagnóstico</span>
<button class="chip-fonte"><svg class="i i-sm" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"></ellipse><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"></path><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"></path></svg>Status do plano · jul</button>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<div style="display: flex; flex-direction: column; padding: 8px 10px; border-radius: 12px; background: var(--row)"><span class="kpi-label" style="font-size: 12.5px">Planejado</span><span class="num" style="font-size: 18px; font-weight: 900">R$ 1.702</span></div>
<div style="display: flex; flex-direction: column; padding: 8px 10px; border-radius: 12px; background: var(--row)"><span class="kpi-label" style="font-size: 12.5px">Realizado</span><span class="num" style="font-size: 18px; font-weight: 900">R$ 900</span></div>
<div style="display: flex; flex-direction: column; padding: 8px 10px; border-radius: 12px; background: var(--warn-soft)"><span class="kpi-label" style="font-size: 12.5px; color: var(--warn)">Desvio</span><span class="num" style="font-size: 18px; font-weight: 900; color: var(--warn)">−R$ 802</span></div>
</div>
<div class="meter warn"><span style="width: 53%"></span></div>
<div class="note note-warn" style="font-size: 14px; line-height: 19px; padding: 9px 12px"><svg class="i" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"></path><path d="M12 10v4M12 17h.01"></path></svg><span><strong>Causa:</strong> Comer fora <span class="num">R$ 540</span> (média <span class="num">R$ 364</span>) e um gasto atípico em Casa.</span></div>
</article>

<article class="glass-card enter" aria-label="CardRotaRecalculada" style="padding: 16px; display: flex; flex-direction: column; gap: 10px; animation-delay: .12s">
<div class="row-between">
<span class="tag tag-rec"><svg class="i i-sm" viewBox="0 0 24 24" style="stroke-width: 2.4"><path d="M12 3v18"></path><path d="M5 6h11l3 3-3 3H5z"></path></svg>Recomendação</span>
<button class="chip-fonte" aria-label="Fonte: Simulação de objetivo, jul/2025" style="padding: 0 8px"><svg class="i i-sm" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"></ellipse><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"></path><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"></path></svg></button>
</div>
<span class="t-title" style="font-size: 17px; line-height: 23px">Recalculei sua rota</span>
<label class="opt sel" style="padding: 11px 12px"><span class="radio"></span><span style="display: flex; flex-direction: column"><span style="font-size: 15.5px; font-weight: 900">A) <span class="num">+R$ 90/mês</span> por 9 meses</span><span class="small" style="font-size: 13.5px">Reduzindo Comer fora.</span></span></label>
<label class="opt" style="padding: 11px 12px"><span class="radio"></span><span style="display: flex; flex-direction: column"><span style="font-size: 15.5px; font-weight: 900">B) <span class="num">+R$ 268/mês</span> por 3 meses</span><span class="small" style="font-size: 13.5px">Recupera mais rápido.</span></span></label>
<button class="btn btn-primary" style="width: 100%">Adotar nova rota</button>
<span class="small" style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; justify-content: center"><svg class="i i-sm" viewBox="0 0 24 24" style="color: var(--ok)"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"></path></svg>Abre um pedido de autorização</span>
</article>
</div>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["claro","escuro"],"default":"claro"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const escuro = this.props.tema === 'escuro';
    return { tema: escuro ? 'escuro' : 'claro', temaCls: escuro ? 'dark' : '', atual: 5 };
  }
}
</script>
</body>
</html>
