<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>M1 · Boas-vindas</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bussola.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="app tokens {{temaCls}}" data-estado="objetivo" style="width: 390px; height: 844px; font-family: 'Nunito Sans', system-ui, sans-serif; color: var(--ink)">
<div class="ambient" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="layer" style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px 12px 16px; display: flex; flex-direction: column; gap: 12px">
<dc-import name="MTopo" atual="{{atual}}" tema="{{tema}}" hint-size="366px,102px"></dc-import>

<section aria-label="Conversa" style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 22px">
<div class="enter" style="display: flex; flex-direction: column; gap: 10px; padding: 0 6px">
<span class="brand-mark" style="width: 52px; height: 52px; border-radius: 17px"><svg class="i i-xl" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg></span>
<h1 style="margin: 6px 0 0; font-size: 32px; line-height: 38px; font-weight: 900; letter-spacing: -.02em">Oi, Fernando!</h1>
<p style="margin: 0; font-size: 18px; line-height: 26px; font-weight: 600; color: var(--ink-2)">Eu sou a Bússola, da ia.i. Qual objetivo você quer tirar do papel?</p>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<button class="glass-card cursor-glow" style="font: inherit; color: var(--ink); cursor: pointer; padding: 12px 14px; display: flex; align-items: center; gap: 12px; border-radius: 18px; text-align: left; min-height: 60px">
<span style="width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-ink); flex-shrink: 0"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-5h4v5"></path></svg></span>
<span style="font-size: 16px; font-weight: 800; line-height: 21px">Quero comprar meu primeiro apartamento</span>
</button>
<button class="glass-card" style="font: inherit; color: var(--ink); cursor: pointer; padding: 12px 14px; display: flex; align-items: center; gap: 12px; border-radius: 18px; text-align: left; min-height: 60px">
<span style="width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--row); color: var(--ink-2); flex-shrink: 0"><svg class="i" viewBox="0 0 24 24"><path d="M2 16l20-8-3 9-6-3-3 5-1-5z"></path></svg></span>
<span style="font-size: 16px; font-weight: 800; line-height: 21px">Quero viajar no ano que vem</span>
</button>
<button class="glass-card" style="font: inherit; color: var(--ink); cursor: pointer; padding: 12px 14px; display: flex; align-items: center; gap: 12px; border-radius: 18px; text-align: left; min-height: 60px">
<span style="width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--row); color: var(--ink-2); flex-shrink: 0"><svg class="i" viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"></path><path d="M6 11v5c3 2 9 2 12 0v-5"></path></svg></span>
<span style="font-size: 16px; font-weight: 800; line-height: 21px">Quero fazer uma pós</span>
</button>
<button class="glass-card" style="font: inherit; color: var(--ink); cursor: pointer; padding: 12px 14px; display: flex; align-items: center; gap: 12px; border-radius: 18px; text-align: left; min-height: 60px">
<span style="width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--row); color: var(--ink-2); flex-shrink: 0"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h6"></path><path d="M16 16l2 2 4-4"></path></svg></span>
<span style="font-size: 16px; font-weight: 800; line-height: 21px">Quero organizar minhas dívidas</span>
</button>
</div>
<p class="disclaimer" style="margin: 0; padding: 0 6px; align-items: flex-start"><svg class="i i-sm" viewBox="0 0 24 24" style="margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>Eu analiso, simulo e recomendo. Qualquer ação só acontece com a sua autorização.</p>
</section>

<div class="glass-chrome composer" style="height: 54px; border-radius: 22px; padding: 0 6px 0 16px">
<label class="sr-only" for="m1-msg">Mensagem para a Bússola</label>
<input id="m1-msg" type="text" placeholder="Conte seu objetivo…" style="font-size: 16px">
<button class="send" aria-label="Enviar"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["claro","escuro"],"default":"claro"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const escuro = this.props.tema === 'escuro';
    return { tema: escuro ? 'escuro' : 'claro', temaCls: escuro ? 'dark' : '', atual: -1 };
  }
}
</script>
</body>
</html>
