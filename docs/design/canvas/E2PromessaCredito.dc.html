<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>E2 · Promessa de crédito</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bussola.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="app tokens {{temaCls}}" data-estado="agir" style="width: 390px; height: 844px; font-family: 'Nunito Sans', system-ui, sans-serif; color: var(--ink)">
<div class="ambient" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="layer" style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px 12px 16px; display: flex; flex-direction: column; gap: 12px">
<dc-import name="MTopo" atual="{{atual}}" tema="{{tema}}" hint-size="366px,102px"></dc-import>
<section class="convo" aria-label="Conversa" style="align-items: stretch">
<div style="display: flex; flex-direction: column; gap: 12px; padding-bottom: 2px">
<div class="msg-client" style="max-width: 300px; font-size: 16px">Então meu financiamento vai ser aprovado?</div>
<article class="glass-card enter" style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div class="note note-info" style="font-size: 14px; line-height: 19px; padding: 9px 12px"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>Não consigo garantir aprovação de crédito.</div>
<p class="prose" style="font-size: 16px">Isso depende de uma análise do banco. Posso simular um financiamento genérico, sem taxas, só como referência.</p>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button class="qr">Simular como referência</button>
<button class="qr">Voltar ao plano</button>
</div>
<span class="disclaimer" style="font-size: 12.5px; align-items: flex-start"><svg class="i i-sm" viewBox="0 0 24 24" style="margin-top: 2px"><path d="M9 3h6M10 3v6L5 19a1.5 1.5 0 0 0 1.3 2h11.4a1.5 1.5 0 0 0 1.3-2L14 9V3"></path></svg>Simulação com dados sintéticos. Não é oferta nem garantia de crédito.</span>
</article>
</div>
</section>
<div class="glass-chrome composer" style="height: 54px; border-radius: 22px; padding: 0 6px 0 16px">
<label class="sr-only" for="e2-msg">Mensagem para a Bússola</label>
<input id="e2-msg" type="text" placeholder="Escreva uma mensagem…" style="font-size: 16px">
<button class="send" aria-label="Enviar"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["claro","escuro"],"default":"claro"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const escuro = this.props.tema === 'escuro';
    return { tema: escuro ? 'escuro' : 'claro', temaCls: escuro ? 'dark' : '', atual: 4 };
  }
}
</script>
</body>
</html>
