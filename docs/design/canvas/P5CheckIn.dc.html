<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>P5 · Check-in mensal</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bussola.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="app tokens {{temaCls}}" data-estado="acompanhar" style="width: 390px; height: 844px; font-family: 'Nunito Sans', system-ui, sans-serif; color: var(--ink)">
<div class="ambient" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="layer" style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px 12px 16px; display: flex; flex-direction: column; gap: 12px">

<div class="glass-chrome enter" role="status" style="border-radius: 20px; padding: 12px 14px; display: flex; gap: 12px; align-items: center">
<span class="brand-mark sm"><svg class="i i-sm" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg></span>
<div style="display: flex; flex-direction: column; flex: 1 1 auto; line-height: 1.3">
<span style="font-size: 14px; font-weight: 900">Bússola</span>
<span class="small" style="font-size: 13.5px">Hoje é dia 5: hora de separar o do apê.</span>
</div>
<span class="small" style="font-size: 12px">agora</span>
</div>

<header style="display: flex; flex-direction: column; gap: 2px; padding: 12px 6px 0">
<span class="eyebrow">Check-in de setembro · 2025</span>
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 900; letter-spacing: -.01em">Separar <span class="num">R$ 1.702</span> para o apê</h1>
</header>

<article class="glass-card" style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<svg viewBox="0 0 60 60" style="width: 56px; height: 56px; flex-shrink: 0" aria-label="5,7% da meta">
<circle cx="30" cy="30" r="24" style="fill: none; stroke: var(--line); stroke-width: 7"></circle>
<circle cx="30" cy="30" r="24" style="fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 8.6 151; transform: rotate(-90deg); transform-origin: 30px 30px"></circle>
</svg>
<div style="display: flex; flex-direction: column">
<span class="small num" style="font-weight: 800; color: var(--ink)">R$ 3.440 de R$ 60.000</span>
<span class="small num">Com este aporte: R$ 5.142 · 8,6%</span>
</div>
</div>
<div class="note" style="background: var(--ok-soft); color: var(--ok); font-size: 14px; line-height: 19px; padding: 9px 12px"><svg class="i" viewBox="0 0 24 24" style="stroke-width: 2.4"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Agosto fechou R$ 36 à frente do plano.</div>
</article>

<div style="display: flex; flex-direction: column; gap: 8px; margin-top: auto">
<button class="btn btn-primary" style="width: 100%"><svg class="i" viewBox="0 0 24 24" style="stroke-width: 2.4"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Já separei R$ 1.702</button>
<button class="btn btn-secondary" style="width: 100%">Separei outro valor</button>
<button class="link-btn" style="align-self: center; min-height: 44px">Este mês está apertado · recalcular rota</button>
<span class="disclaimer" style="font-size: 12.5px; justify-content: center; text-align: center">Você registra o que separou. A Bússola não movimenta dinheiro.</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["claro","escuro"],"default":"claro"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const escuro = this.props.tema === 'escuro';
    return { tema: escuro ? 'escuro' : 'claro', temaCls: escuro ? 'dark' : '' };
  }
}
</script>
</body>
</html>
