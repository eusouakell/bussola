<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>M2 · Objetivo</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bussola.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="app tokens {{temaCls}}" data-estado="objetivo" style="width: 390px; height: 844px; font-family: 'Nunito Sans', system-ui, sans-serif; color: var(--ink)">
<div class="ambient" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="layer" style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px 12px 16px; display: flex; flex-direction: column; gap: 12px">
<dc-import name="MTopo" atual="{{atual}}" tema="{{tema}}" hint-size="366px,102px"></dc-import>

<section class="convo" aria-label="Conversa" style="align-items: stretch">
<div style="display: flex; flex-direction: column; gap: 12px; padding-bottom: 2px">
<div class="msg-client" style="max-width: 290px; font-size: 16px">Quero comprar meu primeiro apartamento.</div>
<article class="glass-card enter" aria-label="CardObjetivo" style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span class="eyebrow">Seu objetivo</span>
<span class="t-title">Primeiro apartamento</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div class="check-item" style="align-items: center; padding: 10px 12px">
<span class="st st-ok"><svg class="i i-sm" viewBox="0 0 24 24" style="stroke-width: 3"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<span class="kpi-label" style="width: 88px">Tipo</span><span style="font-size: 15px; font-weight: 800">Imóvel · 1º apartamento</span>
</div>
<div class="check-item" style="align-items: center; padding: 10px 12px">
<span class="st st-ok"><svg class="i i-sm" viewBox="0 0 24 24" style="stroke-width: 3"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<span class="kpi-label" style="width: 88px">Prioridade</span><span style="font-size: 15px; font-weight: 800">Alta <span style="font-weight: 600; color: var(--ink-3)">(inferida)</span></span>
</div>
<div class="check-item" style="align-items: center; padding: 10px 12px; border-style: dashed; border-color: var(--warn-fill)">
<span class="st st-q"><svg class="i i-sm" viewBox="0 0 24 24" style="stroke-width: 2.4"><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.6"></path><path d="M12 17h.01"></path></svg></span>
<span class="kpi-label" style="width: 88px">Entrada</span><span style="font-size: 15px; font-weight: 800; color: var(--warn)">Falta definir</span>
</div>
<div class="check-item" style="align-items: center; padding: 10px 12px; border-style: dashed; border-color: var(--warn-fill)">
<span class="st st-q"><svg class="i i-sm" viewBox="0 0 24 24" style="stroke-width: 2.4"><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.6"></path><path d="M12 17h.01"></path></svg></span>
<span class="kpi-label" style="width: 88px">Prazo</span><span style="font-size: 15px; font-weight: 800; color: var(--warn)">Falta definir</span>
</div>
</div>
<p class="prose" style="font-size: 16px">Pra eu calcular certinho: quanto você quer juntar de entrada, e em quanto tempo?</p>
</article>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button class="qr">R$ 60 mil em 3 anos</button>
<button class="qr">Ainda não sei o valor</button>
<button class="qr">Me mostra opções</button>
</div>
</div>
</section>

<div class="glass-chrome composer" style="height: 54px; border-radius: 22px; padding: 0 6px 0 16px">
<label class="sr-only" for="m2-msg">Mensagem para a Bússola</label>
<input id="m2-msg" type="text" placeholder="Escreva sua resposta…" style="font-size: 16px">
<button class="send" aria-label="Enviar"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["claro","escuro"],"default":"claro"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const escuro = this.props.tema === 'escuro';
    return { tema: escuro ? 'escuro' : 'claro', temaCls: escuro ? 'dark' : '', atual: 0 };
  }
}
</script>
</body>
</html>
