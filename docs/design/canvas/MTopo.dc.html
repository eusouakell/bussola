<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>MTopo · topo mobile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bussola.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="tokens {{temaCls}}" style="width: 366px; height: 102px; display: flex; flex-direction: column; gap: 10px; font-family: 'Nunito Sans', system-ui, sans-serif; color: var(--ink)">
<header class="glass-chrome" style="height: 56px; box-sizing: border-box; border-radius: 20px; display: flex; align-items: center; gap: 8px; padding: 0 6px">
<button class="icon-btn" aria-label="Voltar para a ia.i" style="border: 0"><svg class="i i-lg" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></svg></button>
<span class="brand-mark sm"><svg class="i i-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg></span>
<div style="display: flex; flex-direction: column; line-height: 1.15; flex: 1 1 auto">
<span style="font-size: 17px; font-weight: 900">Bússola</span>
<span style="font-size: 12.5px; font-weight: 700; color: var(--ink-3)">uma jornada da ia.i</span>
</div>
<button class="icon-btn" aria-label="Abrir Bastidores" style="border: 0"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M15 4v16"></path></svg></button>
</header>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<button class="step-compact" aria-expanded="false" aria-label="Jornada: {{rotulo}}. Toque para ver as 6 etapas">
<span class="n">{{contagem}}</span>
<span>{{nome}}</span>
<span style="display: inline-flex; gap: 3px; margin-left: 2px">
<sc-for list="{{segs}}" as="g" hint-placeholder-count="6"><span style="width: 10px; height: 4px; border-radius: 2px; background: {{g.cor}}"></span></sc-for>
</span>
<svg class="i i-sm" viewBox="0 0 24 24" style="color: var(--ink-3)"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<span class="selo" style="height: 30px; font-size: 12px; padding: 0 10px; gap: 6px"><svg class="i i-sm" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L5 19a1.5 1.5 0 0 0 1.3 2h11.4a1.5 1.5 0 0 0 1.3-2L14 9V3"></path></svg>Dados sintéticos</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"atual":{"editor":"int","min":-1,"max":5,"default":2},"tema":{"editor":"enum","options":["claro","escuro"],"default":"claro"},"$preview":{"width":366,"height":102}}'>
class Component extends DCLogic {
  renderVals() {
    const nomes = ['Objetivo', 'Entender', 'Antecipar', 'Orientar', 'Agir', 'Acompanhar'];
    const a = (this.props.atual === undefined || this.props.atual === null) ? 2 : Number(this.props.atual);
    const segs = nomes.map((n, i) => ({ cor: i < a ? 'var(--ink-2)' : (i === a ? 'var(--accent)' : 'var(--line-strong)') }));
    const iniciou = a >= 0;
    return {
      segs,
      contagem: iniciou ? (a + 1) + '/6' : '0/6',
      nome: iniciou ? nomes[a] : 'Jornada',
      rotulo: iniciou ? 'etapa ' + (a + 1) + ' de 6, ' + nomes[a] : 'ainda não iniciada',
      temaCls: this.props.tema === 'escuro' ? 'dark' : ''
    };
  }
}
</script>
</body>
</html>
