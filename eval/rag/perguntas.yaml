  - id: p17
    tipo: conhecimento
    pergunta: Como saber qual de duas propostas de crédito sai mais barata?
    esperados: [comparar-custo-credito#1, comparar-custo-credito#2, custo-efetivo-total#3]

  - id: p18
    tipo: conhecimento
    pergunta: Onde reclamo se o banco não resolver meu problema?
    esperados: [direitos-consumidor-bancario#4]

  - id: p19
    tipo: produto
    pergunta: Onde guardo o dinheiro da entrada?
    esperados: [cofrinhos#1]

  - id: p20
    tipo: produto
    pergunta: Quero comprar um carro sem pegar financiamento. Que alternativa existe?
    esperados: [consorcio_veiculos#1, consorcio_veiculos#2]

  - id: p21
    tipo: produto
    pergunta: Tem alguma ferramenta para acompanhar meus gastos por categoria e receber alertas?
