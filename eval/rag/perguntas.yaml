  - id: p12
    tipo: conhecimento
    pergunta: Quanto eu deveria ter guardado para emergências?
    esperados: [reserva-emergencia#1, reserva-emergencia#2]

  - id: p13
    tipo: conhecimento
    pergunta: Tenho cartão atrasado, cheque especial e um empréstimo. Qual pago primeiro?
    esperados: [ordem-quitacao#1, ordem-quitacao#3]

  - id: p14
    tipo: conhecimento
    pergunta: Como organizo minhas contas do mês para sobrar dinheiro?
    esperados: [orcamento-mensal#1, orcamento-mensal#2, orcamento-mensal#3]

  - id: p15
    tipo: conhecimento
    pergunta: Qual parte do salário é seguro comprometer com prestações?
    esperados: [comprometimento-renda#1]

  - id: p16
    tipo: conhecimento
    pergunta: Se eu adiantar as parcelas do financiamento, os juros diminuem?
