# Conjunto de avaliação do RAG de conhecimento (ciclo 002).
#
# Cada pergunta positiva lista os trechos que respondem a ela (`esperados`).
# Conta acerto quando pelo menos um deles aparece no top-`k` do buscador.
# `tipo: produto` marca as perguntas que devem trazer um trecho do catálogo.
# As perguntas `negativas` estão fora do domínio: o backend lexico deve
# devolver lista vazia, e o numpy, nenhum trecho acima do limiar.
#
# Rode com `make eval-rag` e registre o resultado em eval/rag/RESULTADOS.md.

k: 3

perguntas:
  - id: p01
    tipo: conhecimento
    pergunta: O banco pode cobrar de juros no cartão mais do que o valor que eu devia?
    esperados: [cartao-rotativo#2]

  - id: p02
    tipo: conhecimento
    pergunta: Por quanto tempo a dívida pode ficar no rotativo do cartão?
    esperados: [cartao-rotativo#1]

  - id: p03
    tipo: conhecimento
    pergunta: Paguei só o mínimo da fatura, o que acontece com o resto?
    esperados: [cartao-rotativo#3, cartao-rotativo#1]

  - id: p04
    tipo: conhecimento
    pergunta: O que é o CET de um empréstimo e o que entra nele?
