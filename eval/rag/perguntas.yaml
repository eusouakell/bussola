  - id: p05
    tipo: conhecimento
    pergunta: Existe um limite para os juros do cheque especial?
    esperados: [cheque-especial#1]

  - id: p06
    tipo: conhecimento
    pergunta: Consigo transferir meu empréstimo para outro banco que cobre menos juros?
    esperados: [portabilidade-credito#1, portabilidade-credito#2, portabilidade-credito#3]

  - id: p07
    tipo: conhecimento
    pergunta: Como vejo todas as dívidas que estão no meu nome no Banco Central?
    esperados: [registrato#1, registrato#2]

  - id: p08
    tipo: conhecimento
    pergunta: O gerente disse que só libera o empréstimo se eu fizer um seguro. Ele pode fazer isso?
    esperados: [direitos-consumidor-bancario#3, comparar-custo-credito#3]

  - id: p09
    tipo: conhecimento
    pergunta: Quais serviços da conta corrente o banco não pode cobrar?
    esperados: [servicos-essenciais#1, servicos-essenciais#2]

  - id: p10
    tipo: conhecimento
    pergunta: Qual a diferença entre consignado e empréstimo pessoal?
    esperados: [modalidades-credito#1, modalidades-credito#2]

  - id: p11
    tipo: conhecimento
    pergunta: Não consigo pagar as dívidas e está faltando dinheiro até para o básico. O que a lei prevê?
