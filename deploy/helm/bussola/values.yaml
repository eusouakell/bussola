# Estado desejado dos serviços Cloud Run da Bússola.
#
# Não há `helm install` no GCP: a org policy bloqueia o GKE. O chart só
# renderiza os manifestos Knative, e o `gcloud run services replace` aplica
# (deploy/helm/README.md).

project:
  id: batalha-time-07-lkbv
  number: "1061873050224"
  region: us-central1

imageRepository: us-central1-docker.pkg.dev/batalha-time-07-lkbv/agentes

# Identidade dos serviços. Plano B: SA default de compute, com IAM em
# nível de dataset e a chave do Gemini lida do Secret Manager.
serviceAccount: 1061873050224-compute@developer.gserviceaccount.com

# Espelha o estado vivo, conferido com `gcloud run services describe` em
# 2026-09-26 (ciclo 007): imagens por digest, env, secretEnv e tráfego. É o
# Plano B; os overlays values-plan-a.yaml e values-plan-b.yaml trocam o plano
# (docs/operacao.md).

# Revisão publicada neste deploy, sempre com 0% de tráfego. O workflow deploy
# passa --set release.tag=main (push na main) ou cNNN (disparo manual) e
# --set release.revisionSuffix=<tag>-<sha>-<tentativa>.
release:
  tag: ""
  revisionSuffix: ""

services:
  mcp:
    name: bussola-mcp
    # Tag ou digest (sha256:...) em imageRepository. Vivo: revisão
    # bussola-mcp-main-7bd374b-final-local (tag main, 0%).
    image: "sha256:a21227646cb4791beb8ac34de13a8c44a4366c3750dc1ade8a24a80edf66bb85"
    cpu: "1"
    # 2Gi por causa do BQ_MODO_LEITURA=memoria: o RepositorioBigQuery carrega
    # as 5 tabelas por cliente no construtor (623 mil linhas de bussola_dados,
    # ~250 MiB só de linhas), e 512Mi estoura no startup com BUSSOLA_FAKES=FALSE.
    # Com bigquery.jobUser na SA (pedido 1), BQ_MODO_LEITURA=query dispensa isso.
    memory: 2Gi
    maxInstances: 1
    env:
      GOOGLE_CLOUD_PROJECT: batalha-time-07-lkbv
      GOOGLE_CLOUD_LOCATION: us-central1
      EMBEDDING_MODEL: gemini-embedding-001
      RAG_BACKEND: lexico
      BQ_DATASET_DADOS: bussola_dados
      # Plano B: list_rows, sem bigquery.jobUser na SA (contratos §4).
      BQ_MODO_LEITURA: memoria
      # FALSE: dados reais de bussola_dados. Exige bigquery.dataViewer na SA
      # (concedido em 2026-09-27; deploy/iam_datasets.sh documenta o comando).
      BUSSOLA_FAKES: "FALSE"
      LOG_LEVEL: INFO
    secretEnv: {}
    # Tráfego mantido; soma 100. O workflow deploy troca esta lista pelo
    # tráfego vivo do serviço (deploy/helm/traffic.jq). Ela vale só para
    # renderizar fora do workflow. Só o 007 muda percentuais. Fica como o
    # traffic.jq devolveria, sem a tag rolante `main`: com ela, o
    # `helm template --set release.tag=main` falharia em todos os serviços,
    # porque o Helm renderiza todos os templates.
    traffic:
      - revisionName: bussola-mcp-00001-cis
        percent: 100
        tag: c000

  agent:
    name: bussola-agent
    # Vivo: revisão bussola-agent-main-7bd374b-final-local (tag main, 0%).
    image: "sha256:31479929dcd40df5998e958524a0ae24c55b51b555922455daab30340f9e4a71"
    cpu: "1"
    memory: 1Gi
    maxInstances: 1
    env:
      GOOGLE_CLOUD_PROJECT: batalha-time-07-lkbv
      GOOGLE_CLOUD_LOCATION: global
      # Plano B: Gemini API com a chave do Secret Manager (secretEnv).
      GOOGLE_GENAI_USE_VERTEXAI: "FALSE"
      BUSSOLA_MODEL: gemini-3.8-flash
      MCP_URL: https://bussola-mcp-wimifi56uq-uc.a.run.app/mcp
      MCP_USE_OIDC: "TRUE"
      ANCHOR_USER_ID: 36a21505-d6d4-42d3-b319-d51a133c7269
      REPLAY_START_ANOMES: "202506"
      BQ_DATASET_APP: bussola_app
      BUSSOLA_FAKES: "TRUE"
      LOG_LEVEL: INFO
    # Lidos pelo Cloud Run em tempo de execução; a SA precisa de
    # roles/secretmanager.secretAccessor no segredo.
    secretEnv:
      GOOGLE_API_KEY:
        secret: gemini-api-key
        version: latest
    traffic:
      - revisionName: bussola-agent-00001-mix
        percent: 100
        tag: c000

  # Front e BFF (web/Dockerfile). É o único serviço público (`public: true`):
  # o BFF faz o login simulado por persona e fala com o agente usando um ID
  # token da SA, que precisa de roles/run.invoker no bussola-agent. Sessões e
  # limite de tentativas de login ficam em memória, daí uma instância só.
  bff:
    name: bussola-bff
    # Vivo: revisão bussola-bff-main-7bd374b-final-local (tag main, 0%); os 100%
    # seguem na bussola-bff-main-9766008-foco-local.
    image: "sha256:ae20836b130c1911101472eb0e6e6ea595d477b346fbc7c26c20e85909987af9"
    cpu: "1"
    memory: 512Mi
    maxInstances: 1
    public: true
    env:
      # FALSE: personas reais de bussola_dados.users por tabledata.list
      # (web/bff/main/config.ts). Exige bigquery.dataViewer na SA (mesma
      # concessão do mcp, acima) e GOOGLE_CLOUD_PROJECT, já definido abaixo.
      BUSSOLA_FAKES: "FALSE"
      GOOGLE_CLOUD_PROJECT: batalha-time-07-lkbv
      # Revisão da tag main do agente (Gemini, plano B). O Cloud Run recusa um
      # ID token com a URL da tag como audience: ela vai na URL principal.
      AGENT_URL: https://main---bussola-agent-wimifi56uq-uc.a.run.app
      AGENT_AUDIENCE: https://bussola-agent-wimifi56uq-uc.a.run.app
      AGENT_APP: bussola_agent
      AGENT_USE_OIDC: "TRUE"
    # Hash scrypt da senha padrão de teste (npm run -s hash-password). A senha
    # em si não fica em lugar nenhum do repositório.
    secretEnv:
      AUTH_PASSWORD_HASH:
        secret: bussola-auth-password-hash
        version: latest
    # Criado com `create: true` (deploy/helm/README.md) e promovido depois.
    # Criar de novo exige --set services.bff.traffic=null.
    traffic:
      - revisionName: bussola-bff-main-9766008-foco-local
        percent: 100

# Modo promoção (ciclo 007): muda só o tráfego, sem revisão nova. Preenchido
# pelo deploy/helm/promote.jq a partir do `services describe`; com
# `service` vazio, o chart está no modo deploy (templates <serviço>-service).
promotion:
  service: ""
  # main, cNNN, previous (rollback) ou nome de uma revisão no tráfego vivo.
  target: ""
  live: {}
